name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove API keys, private recordings, and sensitive text before submitting.

  - type: input
    id: version
    attributes:
      label: VoxWrite version
      description: Find this in the app or release package name.
      placeholder: "0.3.32"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - macOS
        - Windows
        - Linux (X11)
        - Linux (Wayland)
        - Android
        - Other
    validations:
      required: true

  - type: input
    id: platform-version
    attributes:
      label: Platform version
      placeholder: "For example: macOS 15.6, Windows 11, Ubuntu 26.04, Android 16"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Enable ...
        3. Press ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Optional. Redact credentials and private content.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed API keys, recordings, and other sensitive information.
          required: true
        - label: This is not a security vulnerability; security reports follow SECURITY.md.
          required: true
