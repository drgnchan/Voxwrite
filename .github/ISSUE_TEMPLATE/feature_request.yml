name: Feature request
description: Suggest an improvement to VoxWrite
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting an improvement. Please explain the user problem before proposing a solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Relevant platforms
      multiple: true
      options:
        - All platforms
        - macOS
        - Windows
        - Linux
        - Android
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or alternative designs.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized examples, mockups, or related links.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: I removed credentials and private information.
          required: true
